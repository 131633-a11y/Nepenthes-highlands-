<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nepenthes Highlands</title>
<style>body{margin:0;background:#0c1a12;color:#eef6e6;font:18px Georgia,serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}</style>
</head><body>
<p id="s">Loading Nepenthes Highlands…</p>
<script>
/* Loads the game from game.html, fixes the extras.js tag position, then starts it. */
fetch('game.html').then(r=>{if(!r.ok)throw 0;return r.text()}).then(h=>{
h=h.replace(/<script src="extras\.js"><\/script>/g,'');
h=h.replace(/<\/body>/i,'<script src="extras.js"><\/script></body>');
document.open();document.write(h);document.close()
}).catch(()=>{document.getElementById('s').textContent='Could not load game.html. Check that your original game file was renamed to game.html, and open this page through GitHub Pages or a local web server.'});
</script>
</body></html>
